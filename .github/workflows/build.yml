name: Build Pudge Rider APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Pudge Rider project
        run: |
          mkdir -p project

          if [ -f "PudgeRiderBot_v3_GitHub.zip" ]; then
            unzip -q "PudgeRiderBot_v3_GitHub.zip" -d project
          elif [ -f "PudgeRiderBot_v2.zip" ]; then
            unzip -q "PudgeRiderBot_v2.zip" -d project
          else
            echo "ERROR: Pudge Rider ZIP not found"
            ls -la
            exit 1
          fi

          echo "Project contents:"
          find project -maxdepth 3 -type f | sort

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: project
        run: |
          gradle --no-daemon --stacktrace clean assembleDebug

      - name: Find APK
        run: |
          echo "APK files:"
          find project -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: PudgeRiderBot-debug-apk
          path: project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          echo "Project contents:"
          find project -maxdepth 2 -type f | sort

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: project
        run: |
          gradle --no-daemon --stacktrace clean assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PudgeRiderBot-debug-apk
          path: project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Build debug APK
        run: gradle --no-daemon --stacktrace clean assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PudgeRiderBot-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
